<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TK McGhee | Under Construction</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Coming+Soon&family=Gochi+Hand&family=Roboto+Condensed:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #060608;
            --paper-bg: #e4dcd0;
            --ink-dark: #1c1815;
            --ink-red: #8b0000;
            --neon-teal: #00f0ff;
            --neon-violet: #bd00ff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            font-family: 'Roboto Condensed', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: #fff;
        }

        .desk-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at 50% 45%, #18151f 0%, #060508 75%, #010102 100%);
            perspective: 1600px;
        }

        .journal {
            position: relative;
            width: 440px;
            height: 600px;
            background: #0f0805;
            border-radius: 6px 18px 18px 6px;
            transform-style: preserve-3d;
            transform: rotateX(3deg) rotateY(-5deg);
            box-shadow: 
                -30px 40px 70px rgba(0, 0, 0, 0.95),
                0 0 40px rgba(0, 240, 255, 0.12),
                0 20px 50px rgba(189, 0, 255, 0.18);
        }

        .journal-cover {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #140804;
            background-image: 
                linear-gradient(135deg, rgba(20, 10, 6, 0.4) 0%, rgba(5, 2, 1, 0.9) 100%),
                url('assets/texture.jpg');
            background-size: cover;
            background-position: center;
            border-radius: 6px 18px 18px 6px;
            border-left: 18px solid #080402;
            padding: 35px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            text-align: center;
            overflow: hidden;
            box-shadow: inset 0 0 90px rgba(0, 0, 0, 0.92);
        }

        .rainbow-strap {
            position: absolute;
            top: -2px;
            right: 50px;
            width: 30px;
            height: calc(100% + 4px);
            background: linear-gradient(90deg, 
                #d60000 0%, #ff7700 16%, #ffcc00 33%, 
                #008800 50%, #0000dd 66%, #4b0082 83%, #800080 100%);
            box-shadow: 6px 0 16px rgba(0, 0, 0, 0.9);
        }

        .carved-text {
            font-family: 'Gochi Hand', cursive;
            font-size: 2.2rem;
            color: #1a0b05;
            opacity: 0.9;
            mix-blend-mode: multiply;
            text-shadow: 1px 1px 1px rgba(255, 255, 255, 0.1), -1px -1px 2px rgba(0, 0, 0, 0.9);
            transform: rotate(-4deg);
            align-self: flex-start;
            margin-left: 10px;
        }

        /* Burning Salt Line Animation Container */
        .salt-container {
            margin: auto 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .salt-line {
            width: 280px;
            height: 6px;
            background: linear-gradient(90deg, transparent, #ffffff, #e0ded7, #ffffff, transparent);
            box-shadow: 0 0 12px var(--neon-teal), 0 0 25px rgba(0, 240, 255, 0.6);
            border-radius: 3px;
            animation: pulse-salt 2s infinite alternate ease-in-out;
        }

        @keyframes pulse-salt {
            0% { opacity: 0.7; box-shadow: 0 0 8px var(--neon-teal); }
            100% { opacity: 1; box-shadow: 0 0 20px var(--neon-teal), 0 0 30px rgba(189, 0, 255, 0.5); }
        }

        .construction-text {
            font-family: 'Coming Soon', cursive;
            color: var(--neon-teal);
            font-size: 1.3rem;
            text-shadow: 0 0 10px var(--neon-teal), 0 0 20px rgba(0, 240, 255, 0.4);
            letter-spacing: 1.5px;
        }

        .sub-warning {
            font-size: 0.8rem;
            color: #bfa89b;
            font-family: 'Roboto Condensed', sans-serif;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* Stickers on cover */
        .sticker {
            position: absolute;
            z-index: 7;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.85));
        }

        .supernatural-sticker {
            width: 130px;
            height: 130px;
            top: 110px;
            left: 30px;
            transform: rotate(-14deg);
        }

        .wot-sticker {
            width: 100px;
            height: 100px;
            bottom: 80px;
            right: 50px;
            transform: rotate(12deg);
            padding: 4px;
            background: #000;
            border-radius: 8px;
            border: 2px solid #222;
        }

        .sticker-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }
    </style>
</head>
<body>
    <div class="desk-container">
        <div class="journal">
            <div class="journal-cover">
                <div class="rainbow-strap"></div>
                <div class="carved-text">CassDean</div>
                
                <!-- Stickers -->
                <div class="sticker supernatural-sticker">
                    <img src="assets/supernaturalsticker.png" alt="Supernatural Sticker" class="sticker-img">
                </div>
                <div class="sticker wot-sticker">
                    <img src="assets/wotsticker.jpg" alt="Wheel of Time Sticker" class="sticker-img">
                </div>

                <!-- Center Animation -->
                <div class="salt-container">
                    <div class="salt-line"></div>
                    <div class="construction-text">WARDING IN PROGRESS...</div>
                    <div class="sub-warning">Check salt lines before entry</div>
                    <div class="salt-line"></div>
                </div>

                <div style="height: 20px;"></div>
            </div>
        </div>
    </div>
</body>
</html>
